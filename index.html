<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Heart Rate Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- MQTT.js (Browser version) -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        green: {
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0fdf4; color: #1f2937; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(134, 239, 172, 0.4); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .heart-beat { animation: beat 1s infinite alternate; }
        @keyframes beat {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        /* Custom scrollbar for logs (Light Theme) */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Sidebar / Settings Panel -->
    <aside class="w-full md:w-80 glass-panel h-auto md:h-full p-6 flex flex-col z-10 border-r border-green-200">
        <div class="flex items-center gap-4 mb-8">
            <img src="device openhouse69.png" alt="Open House 69 Logo" class="w-16 h-auto object-contain drop-shadow-md">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-gray-800">Kajonkiet<span class="text-gray-800">suksa</span></h1>
                <p class="text-xs font-semibold text-green-600 tracking-wider">OPEN HOUSE 69</p>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto pr-2">
            <h2 class="text-sm uppercase tracking-wider text-gray-500 font-semibold mb-4">Connection Settings</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">WebSocket Broker URL</label>
                    <input type="text" id="brokerUrl" value="wss://broker.emqx.io:8084/mqtt" class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2 text-sm text-gray-800 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-colors shadow-sm">
                    <p class="text-xs text-gray-400 mt-1">Must be wss:// for secure web connection.</p>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Subscribe Topic</label>
                    <input type="text" id="subTopic" value="esp32/myheartrate/data" class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2 text-sm text-gray-800 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-colors shadow-sm">
                </div>

                <div class="pt-2 flex gap-2">
                    <button id="btnConnect" onclick="connectMQTT()" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-md shadow-green-500/20">
                        <i class="fa-solid fa-link"></i> Connect
                    </button>
                    <button id="btnDisconnect" onclick="disconnectMQTT()" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 hidden shadow-md shadow-red-500/20">
                        <i class="fa-solid fa-link-slash"></i> Disconnect
                    </button>
                </div>
            </div>

            <div class="mt-8">
                <h2 class="text-sm uppercase tracking-wider text-gray-500 font-semibold mb-4">Status</h2>
                <div class="flex items-center gap-3 bg-white rounded-lg p-3 border border-gray-200 shadow-sm">
                    <div id="statusDot" class="w-3 h-3 rounded-full bg-gray-400 shadow-[0_0_8px_rgba(156,163,175,0.8)]"></div>
                    <span id="statusText" class="text-sm font-medium text-gray-500">Disconnected</span>
                </div>
            </div>
            
            <!-- Message Log -->
            <div class="mt-8 flex-1 flex flex-col">
                 <h2 class="text-sm uppercase tracking-wider text-gray-500 font-semibold mb-4">Raw Messages</h2>
                 <div id="logArea" class="bg-gray-50 border border-gray-200 rounded-lg p-3 h-40 overflow-y-auto text-xs font-mono text-gray-600 space-y-1 shadow-inner">
                    <!-- Logs will appear here -->
                    <div class="text-gray-400 italic">Waiting for connection...</div>
                 </div>
            </div>
        </div>
    </aside>

    <!-- Main Dashboard Area -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto flex flex-col gap-6">
        
        <!-- Top Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- BPM Card -->
            <div class="glass-panel rounded-2xl p-6 relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-green-500/10 rounded-full blur-2xl group-hover:bg-green-500/20 transition-all"></div>
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-gray-500 font-medium text-sm">Current BPM</p>
                        <h3 class="text-4xl font-bold text-gray-800 mt-1" id="valBPM">--</h3>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-green-600 shadow-inner">
                        <i class="fa-solid fa-heart heart-beat"></i>
                    </div>
                </div>
                <p class="text-xs text-gray-500 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-green-500"></span> Live Data
                </p>
            </div>

            <!-- Average BPM Card -->
            <div class="glass-panel rounded-2xl p-6 relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-teal-500/10 rounded-full blur-2xl group-hover:bg-teal-500/20 transition-all"></div>
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-gray-500 font-medium text-sm">Average BPM</p>
                        <h3 class="text-4xl font-bold text-gray-800 mt-1" id="valAvgBPM">--</h3>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-teal-100 flex items-center justify-center text-teal-600 shadow-inner">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                </div>
                <p class="text-xs text-gray-500">Calculated over last samples</p>
            </div>

            <!-- IR Value Card -->
            <div class="glass-panel rounded-2xl p-6 relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-emerald-500/10 rounded-full blur-2xl group-hover:bg-emerald-500/20 transition-all"></div>
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-gray-500 font-medium text-sm">Infrared (IR) Value</p>
                        <h3 class="text-3xl font-bold text-gray-800 mt-2" id="valIR">--</h3>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 shadow-inner">
                        <i class="fa-solid fa-fingerprint"></i>
                    </div>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-1.5 mt-4 overflow-hidden">
                    <div class="bg-emerald-500 h-1.5 rounded-full transition-all duration-300" id="irBar" style="width: 0%"></div>
                </div>
            </div>

        </div>

        <!-- Chart Area -->
        <div class="glass-panel rounded-2xl p-6 flex-1 flex flex-col min-h-[400px]">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-semibold text-gray-800">Heart Rate History</h3>
                <button onclick="publishMockData()" class="text-xs bg-white hover:bg-gray-50 text-gray-600 py-1.5 px-3 rounded-lg border border-gray-300 transition-colors shadow-sm">
                    <i class="fa-solid fa-vial"></i> Send Mock Data
                </button>
            </div>
            <div class="relative flex-1 w-full">
                <canvas id="bpmChart"></canvas>
            </div>
        </div>

    </main>

    <script>
        // UI Elements
        const btnConnect = document.getElementById('btnConnect');
        const btnDisconnect = document.getElementById('btnDisconnect');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const logArea = document.getElementById('logArea');
        
        const valBPM = document.getElementById('valBPM');
        const valAvgBPM = document.getElementById('valAvgBPM');
        const valIR = document.getElementById('valIR');
        const irBar = document.getElementById('irBar');

        // Global Variables
        let client = null;
        let chart;
        const maxDataPoints = 30;

        // Initialize Chart.js
        function initChart() {
            const ctx = document.getElementById('bpmChart').getContext('2d');
            
            // Gradient fill (Green Theme)
            let gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(34, 197, 94, 0.4)'); // Green-500
            gradient.addColorStop(1, 'rgba(34, 197, 94, 0.0)');

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(maxDataPoints).fill(''),
                    datasets: [{
                        label: 'BPM',
                        data: Array(maxDataPoints).fill(null),
                        borderColor: '#16a34a', // Green-600
                        backgroundColor: gradient,
                        borderWidth: 2,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#16a34a',
                        pointBorderWidth: 2,
                        pointRadius: 3,
                        pointHoverRadius: 5,
                        fill: true,
                        tension: 0.4 // Smooth curves
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 0 }, // Disable animation for performance on real-time data
                    plugins: {
                        legend: { display: false },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        x: {
                            display: false, // Hide x-axis labels
                            grid: { display: false }
                        },
                        y: {
                            min: 40,
                            max: 180,
                            grid: { color: 'rgba(209, 213, 219, 0.5)' }, // Light gray grid
                            ticks: { color: '#6b7280' } // Gray-500
                        }
                    }
                }
            });
        }

        // Add Data to Chart
        function updateChart(bpm) {
            if(!chart) return;
            
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;

            chart.data.labels.push(timeStr);
            chart.data.datasets[0].data.push(bpm);

            // Remove oldest data point if exceeds max
            if (chart.data.labels.length > maxDataPoints) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }

            chart.update();
        }

        // Utility: Add log message
        function addLog(msg, isError = false) {
            const time = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = isError ? 'text-red-500' : 'text-green-600';
            logEntry.innerHTML = `<span class="text-gray-400">[${time}]</span> ${msg}`;
            
            // Remove initial waiting message
            if(logArea.children.length === 1 && logArea.children[0].classList.contains('italic')) {
                logArea.innerHTML = '';
            }
            
            logArea.prepend(logEntry);
            
            // Keep only last 50 logs
            if (logArea.children.length > 50) {
                logArea.removeChild(logArea.lastChild);
            }
        }

        // UI Update: Connected
        function setUIConnected() {
            btnConnect.classList.add('hidden');
            btnDisconnect.classList.remove('hidden');
            statusDot.className = 'w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]';
            statusText.innerText = 'Connected';
            statusText.className = 'text-sm font-medium text-green-600';
        }

        // UI Update: Disconnected
        function setUIDisconnected() {
            btnDisconnect.classList.add('hidden');
            btnConnect.classList.remove('hidden');
            statusDot.className = 'w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]';
            statusText.innerText = 'Disconnected';
            statusText.className = 'text-sm font-medium text-red-500';
        }

        function connectMQTT() {
            const url = document.getElementById('brokerUrl').value;
            const topic = document.getElementById('subTopic').value;

            if (!url || !topic) {
                addLog('Error: URL and Topic are required.', true);
                return;
            }

            addLog(`Connecting to ${url}...`);
            statusText.innerText = 'Connecting...';
            statusDot.className = 'w-3 h-3 rounded-full bg-yellow-500 shadow-[0_0_8px_rgba(234,179,8,0.8)]';
            statusText.className = 'text-sm font-medium text-yellow-600';

            // Generate a random client ID
            const clientId = 'web_dashboard_' + Math.random().toString(16).substr(2, 8);

            // Connect using MQTT.js
            client = mqtt.connect(url, {
                clientId: clientId,
                clean: true,
                connectTimeout: 4000,
                reconnectPeriod: 1000,
            });

            client.on('connect', () => {
                addLog('Successfully connected to broker');
                setUIConnected();
                
                // Subscribe to topic
                client.subscribe(topic, { qos: 0 }, (err) => {
                    if (!err) {
                        addLog(`Subscribed to: ${topic}`);
                    } else {
                        addLog(`Subscribe error: ${err}`, true);
                    }
                });
            });

            client.on('error', (error) => {
                addLog(`Connection error: ${error}`, true);
                setUIDisconnected();
            });

            client.on('offline', () => {
                addLog('Client offline');
                setUIDisconnected();
            });

            client.on('close', () => {
                addLog('Connection closed');
                setUIDisconnected();
            });

            client.on('message', (topic, message) => {
                const payloadStr = message.toString();
                // addLog(`Msg on ${topic}: ${payloadStr}`); 
                // Commented out above to prevent spamming log. Only parsing data now.

                try {
                    // Expecting JSON format from ESP32: {"bpm": 75, "avg": 72, "ir": 120000}
                    const data = JSON.parse(payloadStr);
                    
                    if (data.bpm !== undefined) {
                        valBPM.innerText = Math.round(data.bpm);
                        updateChart(Math.round(data.bpm));
                        
                        // Heart beat animation speed based on BPM
                        const animationDuration = 60 / data.bpm;
                        document.querySelector('.heart-beat').style.animationDuration = `${animationDuration}s`;
                    }
                    
                    if (data.avg !== undefined) {
                        valAvgBPM.innerText = Math.round(data.avg);
                    }
                    
                    if (data.ir !== undefined) {
                        valIR.innerText = data.ir.toLocaleString();
                        // Map IR value roughly to a percentage for the progress bar (adjust limits based on your sensor)
                        // Assuming 50,000 is min (no finger) and 150,000 is max signal
                        let percent = ((data.ir - 50000) / 100000) * 100;
                        if (percent < 0) percent = 0;
                        if (percent > 100) percent = 100;
                        irBar.style.width = `${percent}%`;
                        
                        if(data.ir < 50000) {
                             addLog("Warning: No finger detected on sensor", true);
                             valBPM.innerText = "--";
                        }
                    }
                    
                } catch (e) {
                    // If not JSON, just log it
                    addLog(`Received non-JSON data: ${payloadStr}`);
                }
            });
        }

        function disconnectMQTT() {
            if (client) {
                client.end();
                client = null;
                addLog('Disconnected by user');
                setUIDisconnected();
            }
        }

        // Helper function to test the dashboard without ESP32
        function publishMockData() {
            if (!client || !client.connected) {
                alert("Please connect to the broker first to send mock data.");
                return;
            }
            const topic = document.getElementById('subTopic').value;
            // Generate realistic looking random data
            const baseBpm = 75;
            const mockBpm = baseBpm + (Math.random() * 20 - 10);
            const mockAvg = baseBpm + (Math.random() * 5 - 2.5);
            const mockIr = 100000 + Math.floor(Math.random() * 20000);
            
            const payload = JSON.stringify({
                bpm: mockBpm,
                avg: mockAvg,
                ir: mockIr
            });

            client.publish(topic, payload);
            addLog(`Sent Mock Data: ${payload}`);
        }

        // Initialize on load
        window.onload = () => {
            initChart();
        };
    </script>
</body>
</html>
